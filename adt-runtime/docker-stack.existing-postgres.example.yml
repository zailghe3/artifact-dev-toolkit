version: "3.8"
services:
  adt-runtime:
    image: poulti/adt-runtime:latest
    environment:
      ADT_RUNTIME_AUTH_SECRET_FILE: /run/secrets/adt_runtime_auth
      ADT_RUNTIME_DB_HOST: adt-runtime-postgres
      ADT_RUNTIME_DB_NAME: adt_runtime
      ADT_RUNTIME_DB_PORT: "5432"
      ADT_RUNTIME_DB_USER: adt_runtime
      ADT_RUNTIME_DB_PASSWORD_FILE: /run/secrets/ADT_Runtime_Postgres_Password
      ADT_RUNTIME_ROOT_KEY_FILE: /runtime-keys/root.json
      ADT_RUNTIME_OLLAMA_ALLOWED_BASE_URLS: ""
      ADT_RUNTIME_WORKER_URL: https://fpo-adt.florian-pouchet.workers.dev
      CODEX_RUNNER_BASE_URL: https://cr.pouchet.net
      CODEX_RUNNER_ACCESS_CLIENT_ID_FILE: /run/secrets/adt_runner_access_client_id
      CODEX_RUNNER_ACCESS_CLIENT_SECRET_FILE: /run/secrets/adt_runner_access_client_secret
      CODEX_RUNNER_SHARED_SECRET_FILE: /run/secrets/adt_runner_shared_secret
      ADT_TOOL_APPROVERS: ""
      ADT_TOOL_OPERATORS: ""
      ADT_TOOL_POLICY_ADMINS: ""
    secrets:
      - adt_runtime_auth
      - adt_runner_access_client_id
      - adt_runner_access_client_secret
      - adt_runner_shared_secret
      - source: ADT_Runtime_Postgres_Password
        uid: "1000"
        gid: "1000"
        mode: 0400
    networks: [ingress, database]
    volumes:
      - runtime-keys:/runtime-keys
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 45s
    deploy:
      replicas: 1
      restart_policy: {condition: on-failure, delay: 5s}
      update_config: {parallelism: 1, order: stop-first, failure_action: pause, monitor: 60s}
      resources:
        limits: {cpus: "1.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}
secrets:
  adt_runtime_auth: {external: true}
  adt_runner_access_client_id: {external: true}
  adt_runner_access_client_secret: {external: true}
  adt_runner_shared_secret: {external: true}
  ADT_Runtime_Postgres_Password: {external: true}
networks:
  ingress: {external: true, name: replace-with-ingress-network}
  database: {external: true, name: replace-with-existing-private-postgres-overlay}
volumes:
  runtime-keys:
    driver: local
    driver_opts:
      type: nfs
      o: addr=replace-with-nfs-server,nfsvers=4.2,hard,timeo=600
      device: ":/replace-with-adt-runtime-keys-export"
