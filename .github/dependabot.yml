version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pinned-github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    versioning-strategy: increase-if-necessary
    groups:
      next-react-opennext-minor-patch:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
          - "@opennextjs/cloudflare"
        update-types:
          - minor
          - patch
      eslint-typescript-types-minor-patch:
        patterns:
          - eslint
          - "eslint-*"
          - typescript
          - typescript-eslint
          - "@typescript-eslint/*"
          - "@types/*"
        update-types:
          - minor
          - patch
      tailwind-postcss-minor-patch:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - postcss
        update-types:
          - minor
          - patch
      cloudflare-tooling-minor-patch:
        patterns:
          - wrangler
        update-types:
          - minor
          - patch
      runtime-support-minor-patch:
        patterns:
          - zod
          - gray-matter
          - remark
          - remark-html
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - npm

  - package-ecosystem: npm
    directory: /adt-runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    versioning-strategy: increase-if-necessary
    groups:
      openai-provider-minor-patch:
        patterns:
          - "@openai/agents"
          - openai
        update-types:
          - minor
          - patch
      langgraph-minor-patch:
        patterns:
          - "@langchain/langgraph"
          - "@langchain/langgraph-checkpoint"
        update-types:
          - minor
          - patch
      mcp-minor-patch:
        patterns:
          - "@modelcontextprotocol/sdk"
        update-types:
          - minor
          - patch
      runtime-support-minor-patch:
        patterns:
          - zod
          - ws
          - undici
          - "@types/ws"
          - "@types/node"
          - typescript
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - npm

  # This entry maintains only codex-runner/package.json and its npm lockfile.
  # Packaged Codex upgrades in codex-runner/release.json remain manual.
  - package-ecosystem: npm
    directory: /codex-runner
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    versioning-strategy: increase-if-necessary
    groups:
      runner-tooling-minor-patch:
        patterns:
          - "@types/node"
          - typescript
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - npm
