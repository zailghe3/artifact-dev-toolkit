name: Repair package lock

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trusted-package-lock-repair
  cancel-in-progress: false

jobs:
  publish-trusted-repair:
    name: publish trusted package-lock repair
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify trusted source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "${DEFAULT_BRANCH}" = main
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install and confirm canonical npm
        run: |
          set -euo pipefail
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          test "$(npm --version)" = "$(node -p 'require("./package.json").packageManager.split("@").at(-1)')"
      - name: Regenerate and validate package lock from trusted main
        run: |
          set -euo pipefail
          saved_lockfile="${RUNNER_TEMP}/package-lock.regenerated.json"
          rm -rf node_modules package-lock.json
          npm install
          test -f package-lock.json
          cp package-lock.json "${saved_lockfile}"
          rm -rf node_modules
          npm ci
          npm run toolchain:validate
          npm test
          npm run lint
          npm run typecheck
          npm run build
          npm run build:worker
          npm run issue:validate
          git reset --hard HEAD
          git clean -fdx
          cp "${saved_lockfile}" package-lock.json
      - name: Validate narrowly scoped repair
        id: validate
        run: |
          set -euo pipefail
          max_bytes=$((5 * 1024 * 1024))
          lockfile_bytes="$(wc -c < package-lock.json)"
          if (( lockfile_bytes > max_bytes )); then
            echo "package-lock.json exceeds ${max_bytes} bytes" >&2
            exit 1
          fi
          mapfile -t changed_files < <(git diff --name-only)
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No package-lock.json change was generated.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "${#changed_files[@]}" -ne 1 || "${changed_files[0]}" != package-lock.json ]]; then
            printf 'Unexpected changed file: %s\n' "${changed_files[@]}" >&2
            exit 1
          fi
          git diff --check
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish validated lockfile-only repair
        if: steps.validate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: repair/regenerate-package-lock
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          test "$(git diff --cached --name-only)" = package-lock.json
          git commit -m 'Regenerate package lock with canonical npm'
          git push --force-with-lease origin "HEAD:refs/heads/${REPAIR_BRANCH}"
          open_pr="$(gh pr list --head "${REPOSITORY_OWNER}:${REPAIR_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${open_pr}" ]]; then
            gh pr create --base main --head "${REPAIR_BRANCH}" --title 'Regenerate package-lock.json with canonical npm' --body 'Maintainer-triggered repair generated and validated from trusted main. Only package-lock.json is changed.'
          else
            gh pr edit "${open_pr}" --title 'Regenerate package-lock.json with canonical npm' --body 'Maintainer-triggered repair generated and validated from trusted main. Only package-lock.json is changed.'
          fi
