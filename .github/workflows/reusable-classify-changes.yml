name: Reusable / classify changes

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      pr_number:
        required: false
        type: string
      base_sha:
        required: false
        type: string
      head_sha:
        required: false
        type: string
    outputs:
      changed_files:
        value: ${{ jobs.classify.outputs.changed_files }}
      canonical_feature_files:
        value: ${{ jobs.classify.outputs.canonical_feature_files }}
      sensitive_files:
        value: ${{ jobs.classify.outputs.sensitive_files }}
      has_feature_request_changes:
        value: ${{ jobs.classify.outputs.has_feature_request_changes }}
      has_sensitive_changes:
        value: ${{ jobs.classify.outputs.has_sensitive_changes }}
      lockfile_repair_files:
        value: ${{ jobs.classify.outputs.lockfile_repair_files }}
      has_lockfile_repair_changes:
        value: ${{ jobs.classify.outputs.has_lockfile_repair_changes }}
      documentation_request_only:
        value: ${{ jobs.classify.outputs.documentation_request_only }}
      verify_root:
        value: ${{ jobs.classify.outputs.verify_root }}
      verify_app:
        value: ${{ jobs.classify.outputs.verify_app }}
      verify_runtime:
        value: ${{ jobs.classify.outputs.verify_runtime }}
      verify_runner:
        value: ${{ jobs.classify.outputs.verify_runner }}
      verify_integration:
        value: ${{ jobs.classify.outputs.verify_integration }}
      smoke_runtime_image:
        value: ${{ jobs.classify.outputs.smoke_runtime_image }}
      smoke_runner_image:
        value: ${{ jobs.classify.outputs.smoke_runner_image }}
      smoke_runner_proxy_policy:
        value: ${{ jobs.classify.outputs.smoke_runner_proxy_policy }}
      deploy_worker:
        value: ${{ jobs.classify.outputs.deploy_worker }}
      apply_migrations:
        value: ${{ jobs.classify.outputs.apply_migrations }}
      deploy_cloudflare:
        value: ${{ jobs.classify.outputs.deploy_cloudflare }}
      publish_runtime:
        value: ${{ jobs.classify.outputs.publish_runtime }}
      publish_runner:
        value: ${{ jobs.classify.outputs.publish_runner }}
      unclassified_files:
        value: ${{ jobs.classify.outputs.unclassified_files }}
      has_unclassified_changes:
        value: ${{ jobs.classify.outputs.has_unclassified_changes }}
      deployable_changes:
        value: ${{ jobs.classify.outputs.deployable_changes }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.classify.outputs.changed_files }}
      canonical_feature_files: ${{ steps.classify.outputs.canonical_feature_files }}
      sensitive_files: ${{ steps.classify.outputs.sensitive_files }}
      has_feature_request_changes: ${{ steps.classify.outputs.has_feature_request_changes }}
      has_sensitive_changes: ${{ steps.classify.outputs.has_sensitive_changes }}
      lockfile_repair_files: ${{ steps.classify.outputs.lockfile_repair_files }}
      has_lockfile_repair_changes: ${{ steps.classify.outputs.has_lockfile_repair_changes }}
      documentation_request_only: ${{ steps.classify.outputs.documentation_request_only }}
      verify_root: ${{ steps.classify.outputs.verify_root }}
      verify_app: ${{ steps.classify.outputs.verify_app }}
      verify_runtime: ${{ steps.classify.outputs.verify_runtime }}
      verify_runner: ${{ steps.classify.outputs.verify_runner }}
      verify_integration: ${{ steps.classify.outputs.verify_integration }}
      smoke_runtime_image: ${{ steps.classify.outputs.smoke_runtime_image }}
      smoke_runner_image: ${{ steps.classify.outputs.smoke_runner_image }}
      smoke_runner_proxy_policy: ${{ steps.classify.outputs.smoke_runner_proxy_policy }}
      deploy_worker: ${{ steps.classify.outputs.deploy_worker }}
      apply_migrations: ${{ steps.classify.outputs.apply_migrations }}
      deploy_cloudflare: ${{ steps.classify.outputs.deploy_cloudflare }}
      publish_runtime: ${{ steps.classify.outputs.publish_runtime }}
      publish_runner: ${{ steps.classify.outputs.publish_runner }}
      unclassified_files: ${{ steps.classify.outputs.unclassified_files }}
      has_unclassified_changes: ${{ steps.classify.outputs.has_unclassified_changes }}
      deployable_changes: ${{ steps.classify.outputs.deployable_changes }}
    steps:
      - name: Check out classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect pull request files
        if: inputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | {filename, previous_filename, status}' > files.jsonl

      - name: Collect pushed files
        if: inputs.mode == 'push'
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-status -M -r "${HEAD_SHA}" > names.txt
          else
            git diff --name-status -M "${BASE_SHA}" "${HEAD_SHA}" > names.txt
          fi
          node --input-type=module <<'NODE' > files.jsonl
          import { readFileSync } from 'node:fs';
          for (const line of readFileSync('names.txt', 'utf8').split('\n')) {
            if (!line.trim()) continue;
            const parts = line.split('\t');
            const code = parts[0];
            if (code.startsWith('R')) console.log(JSON.stringify({ status: 'renamed', previous_filename: parts[1], filename: parts[2] }));
            else console.log(JSON.stringify({ status: code === 'A' ? 'added' : code === 'D' ? 'removed' : 'modified', filename: parts[1] }));
          }
          NODE

      - name: Classify changes
        id: classify
        run: node scripts/classify-changes.mjs files.jsonl

      - name: Summarize classification
        run: |
          set -euo pipefail
          {
            echo '## Change classification'
            echo '- Feature request changes: `${{ steps.classify.outputs.has_feature_request_changes }}`'
            echo '- Sensitive changes: `${{ steps.classify.outputs.has_sensitive_changes }}`'
            echo '- Lockfile repair relevant changes: `${{ steps.classify.outputs.has_lockfile_repair_changes }}`'
            echo '- Documentation/request only: `${{ steps.classify.outputs.documentation_request_only }}`'
            echo '- Verify root/app/runtime/runner/integration: `${{ steps.classify.outputs.verify_root }}` / `${{ steps.classify.outputs.verify_app }}` / `${{ steps.classify.outputs.verify_runtime }}` / `${{ steps.classify.outputs.verify_runner }}` / `${{ steps.classify.outputs.verify_integration }}`'
            echo '- Smoke Runtime/Runner image/Runner proxy: `${{ steps.classify.outputs.smoke_runtime_image }}` / `${{ steps.classify.outputs.smoke_runner_image }}` / `${{ steps.classify.outputs.smoke_runner_proxy_policy }}`'
            echo '- Cloudflare Worker/migrations/aggregate: `${{ steps.classify.outputs.deploy_worker }}` / `${{ steps.classify.outputs.apply_migrations }}` / `${{ steps.classify.outputs.deploy_cloudflare }}`'
            echo '- Publish Runtime/Runner: `${{ steps.classify.outputs.publish_runtime }}` / `${{ steps.classify.outputs.publish_runner }}`'
            echo '- Unclassified changes: `${{ steps.classify.outputs.has_unclassified_changes }}`'
            echo ''
            echo '### Files'
            printf '%s\n' '${{ steps.classify.outputs.changed_files }}'
            if [[ '${{ steps.classify.outputs.has_unclassified_changes }}' == true ]]; then
              echo ''
              echo '### Unclassified files'
              printf '%s\n' '${{ steps.classify.outputs.unclassified_files }}'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail closed on unclassified paths
        if: steps.classify.outputs.has_unclassified_changes == 'true'
        env:
          UNCLASSIFIED_FILES: ${{ steps.classify.outputs.unclassified_files }}
        run: |
          echo 'Change-impact policy does not classify every changed path.' >&2
          printf '%s\n' "$UNCLASSIFIED_FILES" >&2
          exit 1
