name: Publish ADT Runtime
on:
  push:
    branches: [main]
    paths: ["adt-runtime/**", ".github/workflows/publish-adt-runtime.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-adt-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with: {node-version-file: .nvmrc, cache: npm, cache-dependency-path: adt-runtime/package-lock.json}
      - name: Install canonical npm
        run: npm install -g "$(node -p 'require("./adt-runtime/package.json").packageManager')"
      - name: Test exact merged source
        working-directory: adt-runtime
        run: npm ci && npm test && npm run typecheck
      - name: Build and smoke-test exact image
        run: |
          set -euo pipefail
          docker build --build-arg ADT_RUNTIME_REVISION="$GITHUB_SHA" -t adt-runtime:verified adt-runtime
          adt-runtime/scripts/smoke-image.sh adt-runtime:verified "$GITHUB_SHA"
      - name: Authenticate to Docker Hub
        env: {DOCKERHUB_USERNAME: "${{ vars.DOCKERHUB_USERNAME }}", DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish the same verified image under immutable and moving tags
        run: |
          set -euo pipefail
          image=poulti/adt-runtime
          if docker manifest inspect "$image:$GITHUB_SHA" >/dev/null 2>&1; then echo 'Immutable SHA tag already exists; refusing overwrite.'; exit 1; fi
          docker tag adt-runtime:verified "$image:$GITHUB_SHA"
          docker tag adt-runtime:verified "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
          sha_digest=$(docker manifest inspect "$image:$GITHUB_SHA" | sha256sum | cut -d' ' -f1)
          latest_digest=$(docker manifest inspect "$image:latest" | sha256sum | cut -d' ' -f1)
          test "$sha_digest" = "$latest_digest"
