name: Main lifecycle

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-lifecycle-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    name: classify-main
    uses: ./.github/workflows/reusable-classify-changes.yml
    with:
      mode: push
      base_sha: ${{ github.event.before }}
      head_sha: ${{ github.sha }}

  verify-main:
    name: verify-main
    needs: classify
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ github.sha }}

  create-feature-issues:
    name: create-feature-issues
    needs: [classify, verify-main]
    if: needs.classify.outputs.has_feature_request_changes == 'true'
    uses: ./.github/workflows/reusable-create-feature-issues.yml
    permissions:
      contents: read
      issues: write
    with:
      ref: ${{ github.sha }}
      mode: changed
      files: ${{ needs.classify.outputs.canonical_feature_files }}

  resolve-deployment-metadata:
    name: resolve-deployment-metadata
    needs: [classify, verify-main]
    if: needs.verify-main.result == 'success' && needs.classify.outputs.deployable_changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      pull_request_number: ${{ steps.pull-request.outputs.pull_request_number }}
    steps:
      - name: Resolve unique merged pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -u
          pull_request_number=""
          if response="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" 2>/dev/null)"; then
            mapfile -t matches < <(jq -r \
              --arg sha "${COMMIT_SHA}" \
              '[.[] | select(.base.ref == "main" and .merge_commit_sha == $sha) | .number] | unique | .[]' \
              <<< "${response}")
            if [[ "${#matches[@]}" -eq 1 ]]; then
              pull_request_number="${matches[0]}"
            fi
          fi
          echo "pull_request_number=${pull_request_number}" >> "$GITHUB_OUTPUT"
          if [[ -n "${pull_request_number}" ]]; then
            echo "Deployment metadata resolved to PR #${pull_request_number}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No unique merged PR was resolved; deployment will continue without PR metadata." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: deploy-main
    needs: [classify, verify-main, resolve-deployment-metadata]
    if: >
      needs.verify-main.result == 'success' &&
      needs.classify.outputs.deployable_changes == 'true'
    uses: ./.github/workflows/reusable-deploy-cloudflare.yml
    with:
      commit_sha: ${{ github.sha }}
      pull_request_number: ${{ needs.resolve-deployment-metadata.outputs.pull_request_number }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  summary:
    name: lifecycle-summary
    runs-on: ubuntu-latest
    needs: [classify, verify-main, create-feature-issues, deploy]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Write lifecycle summary
        run: |
          set -euo pipefail
          {
            echo '## Main lifecycle summary'
            echo '- Commit: `${{ github.sha }}`'
            echo '- Feature request changes: `${{ needs.classify.outputs.has_feature_request_changes }}`'
            echo '- Deployable changes: `${{ needs.classify.outputs.deployable_changes }}`'
            echo '- Verification: `${{ needs.verify-main.result }}`'
            echo '- Feature issue creation: `${{ needs.create-feature-issues.result }}`'
            if [[ '${{ needs.classify.outputs.deployable_changes }}' != 'true' ]]; then
              echo '- Deployment: skipped — no production-affecting changes'
            else
              echo '- Deployment: `${{ needs.deploy.result }}`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
