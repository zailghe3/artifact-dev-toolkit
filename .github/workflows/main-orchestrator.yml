name: Main lifecycle

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact merged commit or ref to process
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: main-lifecycle-${{ github.repository }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-context:
    name: resolve immutable main context
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.context.outputs.target_sha }}
      base_sha: ${{ steps.context.outputs.base_sha }}
    steps:
      - name: Resolve target and first parent
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_TARGET_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == push ]]; then
            target_sha="${PUSH_TARGET_SHA}"
            base_sha="${PUSH_BASE_SHA}"
          else
            commit="$(gh api "/repos/${REPOSITORY}/commits/${INPUT_REF}")"
            target_sha="$(jq -r '.sha' <<<"${commit}")"
            base_sha="$(jq -r '.parents[0].sha // ""' <<<"${commit}")"
          fi
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "${base_sha}" ]]; then [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]]; fi
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"

  classify:
    name: classify-main
    needs: resolve-context
    uses: ./.github/workflows/reusable-classify-changes.yml
    with:
      mode: push
      base_sha: ${{ needs.resolve-context.outputs.base_sha }}
      head_sha: ${{ needs.resolve-context.outputs.target_sha }}

  verify-main:
    name: verify-main
    needs: [resolve-context, classify]
    if: needs.classify.result == 'success' && needs.classify.outputs.deploy_cloudflare == 'true'
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ needs.resolve-context.outputs.target_sha }}
      # PR CI already verifies component-local work. Main runs only the shared
      # pre-mutation gate needed by Cloudflare operations. Publishers own their
      # trusted exact-commit component tests/builds/smokes.
      verify_root: ${{ needs.classify.outputs.verify_root == 'true' }}
      verify_app: false
      verify_runtime: false
      verify_runner: false
      verify_integration: ${{ needs.classify.outputs.verify_integration == 'true' }}
      smoke_runtime_image: false
      smoke_runner_image: false
      smoke_runner_proxy_policy: false

  create-feature-issues:
    name: create-feature-issues
    needs: [resolve-context, classify]
    if: needs.classify.result == 'success' && needs.classify.outputs.has_feature_request_changes == 'true'
    uses: ./.github/workflows/reusable-create-feature-issues.yml
    permissions:
      contents: read
      issues: write
    with:
      ref: ${{ needs.resolve-context.outputs.target_sha }}
      mode: changed
      files: ${{ needs.classify.outputs.canonical_feature_files }}

  resolve-deployment-metadata:
    name: resolve-deployment-metadata
    needs: [resolve-context, classify, verify-main]
    if: needs.verify-main.result == 'success' && needs.classify.outputs.deploy_worker == 'true'
    runs-on: ubuntu-latest
    outputs:
      pull_request_number: ${{ steps.pull-request.outputs.pull_request_number }}
    steps:
      - name: Resolve unique merged pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ needs.resolve-context.outputs.target_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -u
          pull_request_number=""
          if response="$(gh api -H 'Accept: application/vnd.github+json' "repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" 2>/dev/null)"; then
            mapfile -t matches < <(jq -r --arg sha "${COMMIT_SHA}" '[.[] | select(.base.ref == "main" and .merge_commit_sha == $sha) | .number] | unique | .[]' <<<"${response}")
            if [[ "${#matches[@]}" -eq 1 ]]; then pull_request_number="${matches[0]}"; fi
          fi
          echo "pull_request_number=${pull_request_number}" >> "$GITHUB_OUTPUT"
          if [[ -n "${pull_request_number}" ]]; then
            echo "Deployment metadata resolved to PR #${pull_request_number}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No unique merged PR was resolved; deployment will continue without PR metadata.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: deploy-main
    needs: [resolve-context, classify, verify-main, resolve-deployment-metadata]
    if: >-
      always() &&
      needs.verify-main.result == 'success' &&
      needs.classify.outputs.deploy_cloudflare == 'true' &&
      (needs.classify.outputs.deploy_worker != 'true' || needs.resolve-deployment-metadata.result == 'success')
    uses: ./.github/workflows/reusable-deploy-cloudflare.yml
    with:
      commit_sha: ${{ needs.resolve-context.outputs.target_sha }}
      pull_request_number: ${{ needs.resolve-deployment-metadata.outputs.pull_request_number }}
      deploy_worker: ${{ needs.classify.outputs.deploy_worker == 'true' }}
      apply_migrations: ${{ needs.classify.outputs.apply_migrations == 'true' }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-runtime:
    name: publish-runtime
    needs: [resolve-context, classify, verify-main]
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.publish_runtime == 'true' &&
      (needs.classify.outputs.deploy_cloudflare != 'true' || needs.verify-main.result == 'success')
    uses: ./.github/workflows/publish-adt-runtime.yml
    with:
      commit_sha: ${{ needs.resolve-context.outputs.target_sha }}
      integration_already_verified: ${{ needs.classify.outputs.deploy_cloudflare == 'true' && needs.classify.outputs.verify_integration == 'true' && needs.verify-main.result == 'success' }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  publish-runner:
    name: publish-runner
    needs: [resolve-context, classify, verify-main, deploy]
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.publish_runner == 'true' &&
      (needs.classify.outputs.deploy_cloudflare != 'true' || needs.verify-main.result == 'success') &&
      (needs.classify.outputs.deploy_worker != 'true' || needs.deploy.result == 'success')
    uses: ./.github/workflows/publish-codex-runner.yml
    with:
      commit_sha: ${{ needs.resolve-context.outputs.target_sha }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  summary:
    name: lifecycle-summary
    runs-on: ubuntu-latest
    needs: [resolve-context, classify, verify-main, create-feature-issues, deploy, publish-runtime, publish-runner]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Write lifecycle summary
        run: |
          {
            echo '## Main lifecycle summary'
            echo '- Commit: `${{ needs.resolve-context.outputs.target_sha }}`'
            echo '- Feature request changes: `${{ needs.classify.outputs.has_feature_request_changes }}`'
            echo '- Deploy Worker: `${{ needs.classify.outputs.deploy_worker }}`'
            echo '- Apply migrations: `${{ needs.classify.outputs.apply_migrations }}`'
            echo '- Publish Runtime: `${{ needs.classify.outputs.publish_runtime }}`'
            echo '- Publish Runner: `${{ needs.classify.outputs.publish_runner }}`'
            echo '- Main pre-mutation verification: `${{ needs.verify-main.result }}`'
            echo '- Feature issue creation: `${{ needs.create-feature-issues.result }}`'
            if [[ '${{ needs.classify.outputs.deploy_cloudflare }}' != true ]]; then
              echo '- Cloudflare operation: skipped — Worker and migration inputs unchanged'
            else
              echo '- Cloudflare operation: `${{ needs.deploy.result }}`'
            fi
            if [[ '${{ needs.classify.outputs.publish_runtime }}' != true ]]; then
              echo '- ADT Runtime publication: skipped — image inputs unchanged'
            else
              echo '- ADT Runtime publication: `${{ needs.publish-runtime.result }}`'
            fi
            if [[ '${{ needs.classify.outputs.publish_runner }}' != true ]]; then
              echo '- Codex Runner publication: skipped — image inputs unchanged'
            else
              echo '- Codex Runner publication: `${{ needs.publish-runner.result }}`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
