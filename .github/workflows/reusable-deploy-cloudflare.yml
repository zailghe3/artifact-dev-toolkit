name: Reusable / deploy Cloudflare

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      pull_request_number:
        required: false
        type: string
        default: ""
      require_current_main:
        required: false
        type: boolean
        default: true
      deploy_worker:
        required: false
        type: boolean
        default: true
      apply_migrations:
        required: false
        type: boolean
        default: true
      runner_release_barrier:
        required: false
        type: boolean
        default: false
    outputs:
      worker_deployed:
        description: Whether this invocation actually deployed the requested Worker commit.
        value: ${{ jobs.deploy.outputs.worker_deployed }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: production-cloudflare-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freshness:
    name: verify-current-main
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.manual.outputs.current || steps.main.outputs.current }}
    steps:
      - name: Allow explicit manual recovery target
        if: inputs.require_current_main != true
        id: manual
        run: |
          echo 'current=true' >> "$GITHUB_OUTPUT"
          echo 'Explicit manual recovery deployment may target a historical immutable commit.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check out trusted current main with complete history
        if: inputs.require_current_main == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Require the deployment operation to remain current
        if: inputs.require_current_main == true
        id: main
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          TARGET_DEPLOY_WORKER: ${{ inputs.deploy_worker }}
          TARGET_APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          TARGET_RUNNER_RELEASE_BARRIER: ${{ inputs.runner_release_barrier }}
        run: |
          set -euo pipefail
          current_main="$(git rev-parse HEAD)"
          [[ "${current_main}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${COMMIT_SHA}" == "${current_main}" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "Deployment target ${COMMIT_SHA} is current main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git cat-file -e "${COMMIT_SHA}^{commit}" || ! git merge-base --is-ancestor "${COMMIT_SHA}" "${current_main}"; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping deployment target ${COMMIT_SHA}; it is not an ancestor of current main ${current_main}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FRESHNESS_TARGET_LABEL="Cloudflare target ${COMMIT_SHA}" \
            node scripts/evaluate-deployment-freshness.mjs cloudflare "${COMMIT_SHA}" "${current_main}"

  deploy:
    name: deploy-cloudflare
    needs: freshness
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      worker_deployed: ${{ steps.outcome.outputs.worker_deployed }}
    steps:
      - name: Require at least one Cloudflare operation
        run: |
          test '${{ inputs.deploy_worker }}' = true || test '${{ inputs.apply_migrations }}' = true
          if [[ '${{ inputs.runner_release_barrier }}' == true ]]; then
            test '${{ inputs.deploy_worker }}' = true
          fi

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact deployed commit
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "${checked_out_sha}" = "${{ inputs.commit_sha }}"
          echo "Verified checkout ${checked_out_sha}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install canonical npm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - name: Report runtime versions
        run: |
          echo "Node.js $(node --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Generate deployment metadata environment
        if: inputs.deploy_worker
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "NEXT_PUBLIC_DEPLOYED_AT=${DEPLOYED_AT}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_DEPLOY_COMMIT_SHA=${{ inputs.commit_sha }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_DEPLOY_PULL_REQUEST_NUMBER=${{ inputs.pull_request_number }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_DEPLOY_REPOSITORY=${{ github.repository }}" >> "$GITHUB_ENV"
          echo "Deployment metadata: ${DEPLOYED_AT} / ${{ inputs.commit_sha }} / PR ${{ inputs.pull_request_number }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate production resource bindings
        run: node scripts/validate-production-bindings.mjs

      - name: Build OpenNext Cloudflare worker
        if: inputs.deploy_worker
        run: npm run build:worker

      - name: Apply remote D1 migrations
        if: inputs.apply_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply AUTH_SESSIONS_DB --remote

      - name: Publish to Cloudflare
        if: inputs.deploy_worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Record deployment outcome
        id: outcome
        run: echo 'worker_deployed=${{ inputs.deploy_worker }}' >> "$GITHUB_OUTPUT"

      - name: Smoke test production OAuth initiation
        run: node scripts/smoke-test-oauth-start.mjs

      - name: Summarize deployment
        run: |
          {
            echo "Processed Cloudflare commit ${{ inputs.commit_sha }}."
            echo "- Migrations: ${{ inputs.apply_migrations }}"
            echo "- Worker deployment: ${{ inputs.deploy_worker }}"
            echo "- Shared Runner release barrier: ${{ inputs.runner_release_barrier }}"
            if [[ '${{ inputs.deploy_worker }}' == true ]]; then
              echo "- Pull request: ${{ inputs.pull_request_number }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
