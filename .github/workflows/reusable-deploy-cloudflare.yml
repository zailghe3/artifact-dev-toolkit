name: Reusable / deploy Cloudflare

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      pull_request_number:
        required: false
        type: string
        default: ""
      require_current_main:
        required: false
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: production-cloudflare-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  freshness:
    name: verify-current-main
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.manual.outputs.current || steps.main.outputs.current }}
    steps:
      - name: Allow explicit manual recovery target
        if: inputs.require_current_main != true
        id: manual
        run: |
          echo 'current=true' >> "$GITHUB_OUTPUT"
          echo 'Explicit manual recovery deployment may target a historical immutable commit.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check out trusted current main with complete history
        if: inputs.require_current_main == true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Require the deployment commit to remain current main
        if: inputs.require_current_main == true
        id: main
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          current_main="$(git rev-parse HEAD)"
          [[ "${current_main}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${COMMIT_SHA}" == "${current_main}" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "Deployment target ${COMMIT_SHA} is current main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git cat-file -e "${COMMIT_SHA}^{commit}" || ! git merge-base --is-ancestor "${COMMIT_SHA}" "${current_main}"; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping deployment target ${COMMIT_SHA}; it is not an ancestor of current main ${current_main}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --name-status -M "${COMMIT_SHA}" "${current_main}" > names.txt
          node --input-type=module <<'NODE' > classification.txt
          import { readFileSync } from 'node:fs';
          import { classifyChanges } from './scripts/classify-changes.mjs';
          const files = readFileSync('names.txt', 'utf8').split('\n').filter(Boolean).map((line) => {
            const [code, first, second] = line.split('\t');
            if (code.startsWith('R')) return { status: 'renamed', previous_filename: first, filename: second };
            return { status: code === 'A' ? 'added' : code === 'D' ? 'removed' : 'modified', filename: first };
          });
          console.log(`deployable_changes=${classifyChanges(files).deployable_changes}`);
          NODE
          if grep -Fx 'deployable_changes=false' classification.txt; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "Deployment target ${COMMIT_SHA} remains eligible; intervening changes through ${current_main} are non-deployable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping deployment target ${COMMIT_SHA}; a newer production-affecting change exists through ${current_main}." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: deploy-cloudflare
    needs: freshness
    if: needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact deployed commit
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "${checked_out_sha}" = "${{ inputs.commit_sha }}"
          echo "Verified checkout ${checked_out_sha}" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install canonical npm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - name: Report runtime versions
        run: |
          echo "Node.js $(node --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: npm ci
      - name: Generate deployment metadata environment
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "NEXT_PUBLIC_DEPLOYED_AT=${DEPLOYED_AT}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_DEPLOY_COMMIT_SHA=${{ inputs.commit_sha }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_DEPLOY_PULL_REQUEST_NUMBER=${{ inputs.pull_request_number }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_DEPLOY_REPOSITORY=${{ github.repository }}" >> "$GITHUB_ENV"
          echo "Deployment metadata: ${DEPLOYED_AT} / ${{ inputs.commit_sha }} / PR ${{ inputs.pull_request_number }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate production resource bindings
        run: node scripts/validate-production-bindings.mjs
      - name: Build OpenNext Cloudflare worker
        run: npm run build:worker
      - name: Validate Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"
      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply AUTH_SESSIONS_DB --remote
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test production OAuth initiation
        run: node scripts/smoke-test-oauth-start.mjs
      - name: Summarize deployment
        run: |
          echo "Deployed commit ${{ inputs.commit_sha }} to Cloudflare production." >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request: ${{ inputs.pull_request_number }}" >> "$GITHUB_STEP_SUMMARY"
