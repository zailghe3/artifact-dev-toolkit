name: Publish Codex Runner
on:
  push:
    branches: [main]
    paths: ["codex-runner/**", ".github/workflows/publish-codex-runner.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-codex-runner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with: {node-version: 24, cache: npm, cache-dependency-path: codex-runner/package-lock.json}
      - name: Test exact merged source
        working-directory: codex-runner
        run: npm ci && npm test && npm run typecheck
      - name: Build and smoke test
        run: |
          docker build --build-arg CODEX_RUNNER_VERSION="$GITHUB_SHA" -t adt-codex-runner:validated codex-runner
          docker run --rm adt-codex-runner:validated node dist/validate-device-auth-schema.js codex
          docker run -d --name runner-smoke -p 127.0.0.1:18789:8789 -e CODEX_RUNNER_SHARED_SECRET=ci-only-smoke adt-codex-runner:validated
          trap 'docker rm -f runner-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:18789/health && break; sleep 1; done
          curl --fail --silent -H 'X-Codex-Runner-Secret: ci-only-smoke' http://127.0.0.1:18789/v1/capabilities | jq -e '.protocolVersion == 1 and .codexAvailable == true and .deviceAuth == true'
          curl --fail --silent -H 'X-Codex-Runner-Secret: ci-only-smoke' http://127.0.0.1:18789/v1/auth/status | jq -e '.connected == false and .runtime == "app-server-ready"'
      - name: Authenticate to Docker Hub
        env: {DOCKERHUB_USERNAME: "${{ vars.DOCKERHUB_USERNAME }}", DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish immutable and moving tags
        run: |
          set -euo pipefail
          image=poulti/adt-codex-runner
          if docker manifest inspect "$image:$GITHUB_SHA" >/dev/null 2>&1; then echo "Immutable SHA tag already exists; refusing overwrite."; exit 1; fi
          docker tag adt-codex-runner:validated "$image:$GITHUB_SHA"
          docker tag adt-codex-runner:validated "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
