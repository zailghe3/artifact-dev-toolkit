name: Publish Codex Runner

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-codex-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freshness:
    name: verify-current-runner-source
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.main.outputs.current }}
    steps:
      - name: Check out trusted current main with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Require no newer Runner image input
        id: main
        env:
          TARGET_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          set -euo pipefail
          current_main="$(git rev-parse HEAD)"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${TARGET_SHA}" == "${current_main}" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${TARGET_SHA}^{commit}" || ! git merge-base --is-ancestor "${TARGET_SHA}" "${current_main}"; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping Runner publication; ${TARGET_SHA} is not an ancestor of current main ${current_main}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          FRESHNESS_TARGET_LABEL="Runner target ${TARGET_SHA}" \
            node scripts/evaluate-deployment-freshness.mjs runner "${TARGET_SHA}" "${current_main}"

  publish:
    needs: freshness
    if: github.ref == 'refs/heads/main' && needs.freshness.outputs.current == 'true'
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ inputs.commit_sha || github.sha }}
    steps:
      - name: Checkout exact trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact publication commit
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            codex-runner/package-lock.json

      - name: Install canonical npm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - name: Install root dependencies required by cross-boundary Runner tests
        run: npm ci

      - name: Test exact merged source
        working-directory: codex-runner
        run: npm ci && npm test

      - name: Build Codex Runner image
        run: |
          set -euo pipefail
          report_resources() { df -h; free -h; }
          trap 'status=$?; if [ "$status" -ne 0 ]; then report_resources; fi' EXIT
          report_resources
          docker build --progress=plain --build-arg CODEX_RUNNER_VERSION="${TARGET_SHA}" -t adt-codex-runner:validated codex-runner

      - name: Smoke-test Codex Runner image
        run: codex-runner/scripts/smoke-image.sh adt-codex-runner:validated

      - name: Authenticate to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Publish immutable and moving tags
        run: |
          set -euo pipefail
          image=poulti/adt-codex-runner
          if docker manifest inspect "$image:${TARGET_SHA}" >/dev/null 2>&1; then echo "Immutable SHA tag already exists; refusing overwrite."; exit 1; fi
          docker tag adt-codex-runner:validated "$image:${TARGET_SHA}"
          docker tag adt-codex-runner:validated "$image:latest"
          docker push "$image:${TARGET_SHA}"
          docker push "$image:latest"
