name: PR lifecycle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify-pr
    uses: ./.github/workflows/reusable-classify-changes.yml
    with:
      mode: pr
      pr_number: ${{ github.event.pull_request.number }}

  verify-pr:
    name: verify-pr
    needs: classify
    if: needs.classify.result == 'success'
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      verify_root: ${{ needs.classify.outputs.verify_root == 'true' }}
      verify_app: ${{ needs.classify.outputs.verify_app == 'true' }}
      verify_runtime: ${{ needs.classify.outputs.verify_runtime == 'true' }}
      verify_runner: ${{ needs.classify.outputs.verify_runner == 'true' }}
      verify_integration: ${{ needs.classify.outputs.verify_integration == 'true' }}
      smoke_runtime_image: ${{ needs.classify.outputs.smoke_runtime_image == 'true' }}
      smoke_runner_image: ${{ needs.classify.outputs.smoke_runner_image == 'true' }}
      smoke_runner_proxy_policy: ${{ needs.classify.outputs.smoke_runner_proxy_policy == 'true' }}

  validate-feature-requests:
    name: validate-feature-requests
    needs: classify
    if: needs.classify.outputs.has_feature_request_changes == 'true'
    uses: ./.github/workflows/reusable-validate-feature-requests.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      files: ${{ needs.classify.outputs.canonical_feature_files }}
