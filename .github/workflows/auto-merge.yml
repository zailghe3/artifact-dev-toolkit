name: Trusted auto-merge

on:
  workflow_run:
    workflows: ["PR lifecycle"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: trusted-auto-merge-${{ github.repository }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-and-dispatch-main:
    name: merge and dispatch Main lifecycle
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve associated pull request safely
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "/repos/${REPOSITORY}/commits/${VALIDATED_SHA}/pulls" -H 'Accept: application/vnd.github+json' > pulls.json
          node scripts/auto-merge-orchestration.mjs pulls.json >> "$GITHUB_OUTPUT"

      - name: Summarize safe no-op
        if: steps.pr.outputs.action == 'noop'
        env:
          REASON: ${{ steps.pr.outputs.reason }}
        run: echo "No automatic mutation or dispatch — ${REASON}." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce trusted auto-merge eligibility at merge boundary
        if: steps.pr.outputs.action == 'evaluate'
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.repository_owner }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | {filename, previous_filename, status}' > files.jsonl
          node scripts/auto-merge-eligibility.mjs files.jsonl >> "$GITHUB_OUTPUT"

      - name: Require manual review for sensitive pull request
        if: steps.pr.outputs.action == 'evaluate' && steps.eligibility.outputs.eligible != 'true'
        env:
          REASON: ${{ steps.eligibility.outputs.reason }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          echo "PR #${PR_NUMBER} remains open for manual review — ${REASON}." >> "$GITHUB_STEP_SUMMARY"

      - name: Atomically squash merge validated head
        if: steps.eligibility.outputs.eligible == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" > current.json
          jq '[.]' current.json > current-array.json
          boundary_action="$(node scripts/auto-merge-orchestration.mjs current-array.json | sed -n 's/^action=//p')"
          current_state="$(jq -r '.state' current.json)"
          current_merged="$(jq -r '.merged' current.json)"
          current_head="$(jq -r '.head.sha' current.json)"
          if [[ "${boundary_action}" != evaluate || "${current_merged}" == true || "${current_state}" == closed || "${current_head}" != "${VALIDATED_SHA}" ]]; then
            echo 'merged=false' >> "$GITHUB_OUTPUT"
            echo 'The pull request changed state before the merge boundary; no mutation or dispatch was performed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! response="$(gh api --method PUT "/repos/${REPOSITORY}/pulls/${PR_NUMBER}/merge" -f merge_method=squash -f sha="${VALIDATED_SHA}")"; then
            gh api "/repos/${REPOSITORY}/pulls/${PR_NUMBER}" > after.json
            if [[ "$(jq -r '.merged' after.json)" == true ]]; then
              echo 'merged=false' >> "$GITHUB_OUTPUT"
              echo 'A concurrent actor merged the pull request; the normal push Main lifecycle owns post-merge work.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit 1
          fi
          test "$(jq -r '.merged' <<<"${response}")" = true
          merge_sha="$(jq -r '.sha' <<<"${response}")"
          [[ "${merge_sha}" =~ ^[0-9a-f]{40}$ ]]
          gh api "/repos/${REPOSITORY}/commits/${merge_sha}" --jq '.sha' | grep -Fx "${merge_sha}"
          echo 'merged=true' >> "$GITHUB_OUTPUT"
          echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"

      - name: Dispatch Main lifecycle for immutable merge commit
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run main-orchestrator.yml --repo "${REPOSITORY}" --ref main -f ref="${MERGE_SHA}"
          echo "Dispatched Main lifecycle from trusted main for ${MERGE_SHA}." >> "$GITHUB_STEP_SUMMARY"
