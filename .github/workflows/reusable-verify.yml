name: Reusable / verify

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install canonical npm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - name: Report runtime versions
        run: |
          echo "Node.js $(node --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install ADT Runtime dependencies in isolation
        working-directory: adt-runtime
        run: npm ci
      - name: Validate ADT Runtime in isolation
        working-directory: adt-runtime
        run: npm test && npm run typecheck
      - name: Install dependencies
        run: npm ci
      - name: Validate toolchain contract
        run: npm run toolchain:validate
      - name: Test
        run: npm test
      - name: Validate Runner revision policy
        if: github.base_ref != ''
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          npm run runner-revision:validate -- "origin/${{ github.base_ref }}"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js app
        run: npm run build
      - name: Build OpenNext Cloudflare worker
        run: npm run build:worker
      - name: Install Codex Runner dependencies
        working-directory: codex-runner
        run: npm ci
      - name: Validate Codex Runner
        working-directory: codex-runner
        run: npm test && npm run typecheck
      - name: Build Codex Runner image
        run: docker build --progress=plain --build-arg CODEX_RUNNER_VERSION="${{ inputs.ref }}" -t adt-codex-runner:pr-verified codex-runner
      - name: Prepare Linux user namespaces for Codex sandbox
        run: |
          set -euo pipefail
          require_sysctl() {
            local key=$1 expected=$2 path="/proc/sys/${1//./\/}" current
            if [[ ! -e "$path" ]]; then return; fi
            current=$(sysctl -n "$key")
            if [[ "$current" != "$expected" ]]; then
              sudo sysctl -w "$key=$expected" >/dev/null
            fi
            current=$(sysctl -n "$key")
            if [[ "$current" != "$expected" ]]; then
              echo "Codex sandbox prerequisite unavailable: $key must equal $expected." >&2
              exit 1
            fi
          }
          require_sysctl kernel.unprivileged_userns_clone 1
          require_sysctl kernel.apparmor_restrict_unprivileged_userns 0
      - name: Smoke-test Codex Runner image
        run: codex-runner/scripts/smoke-image.sh adt-codex-runner:pr-verified
      - name: Smoke-test Codex Runner proxy policy
        run: codex-runner/scripts/smoke-proxy-policy.sh
      - name: Test control-plane and ADT Runtime integration
        run: npm run test:workflow-runtime-integration
      - name: Build and smoke-test ADT Runtime image without publishing
        run: |
          docker build --build-arg ADT_RUNTIME_REVISION="${{ inputs.ref }}" -t adt-runtime:pr-verified adt-runtime
          adt-runtime/scripts/smoke-image.sh adt-runtime:pr-verified "${{ inputs.ref }}"
