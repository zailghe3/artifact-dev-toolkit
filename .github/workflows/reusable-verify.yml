name: Reusable / verify

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install canonical npm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - name: Report runtime versions
        run: |
          echo "Node.js $(node --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: npm ci
      - name: Validate toolchain contract
        run: npm run toolchain:validate
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js app
        run: npm run build
      - name: Build OpenNext Cloudflare worker
        run: npm run build:worker
      - name: Install Codex Runner dependencies
        working-directory: codex-runner
        run: npm ci
      - name: Validate Codex Runner
        working-directory: codex-runner
        run: npm test && npm run typecheck
      - name: Build and smoke-test Codex Runner image
        run: |
          docker build --build-arg CODEX_RUNNER_VERSION="${{ inputs.ref }}" -t adt-codex-runner:pr codex-runner
          secret_file="$(mktemp)"
          printf '%s' 'ci-smoke-secret' > "$secret_file"
          docker run -d --name adt-codex-runner-smoke -p 127.0.0.1:18789:8789 \
            -e CODEX_RUNNER_SHARED_SECRET_FILE=/run/secrets/runner \
            -v "$secret_file:/run/secrets/runner:ro" adt-codex-runner:pr
          trap 'docker rm -f adt-codex-runner-smoke >/dev/null 2>&1 || true; rm -f "$secret_file"' EXIT
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:18789/health && exit 0; sleep 1; done
          docker logs adt-codex-runner-smoke
          exit 1
