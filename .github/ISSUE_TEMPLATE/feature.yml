name: Feature request
description: Propose a new capability or improvement for the application
title: "[Feature ID]: "
labels:
  - "type:feature"
body:
  - type: markdown
    attributes:
      value: |
        Use this template for implementation-ready features. Discuss the idea first if the scope or user experience is still unclear.

        Assign a Feature ID before implementation using the repository convention, such as `DEV-001`. The Feature ID identifies the product capability independently from the GitHub issue number; the GitHub issue number remains the canonical work-item tracker.

        Describe the durable outcome and observable constraints rather than predicting the internal implementation. Current implementation context may be useful, but Codex will revalidate it against current `main` before editing.

  # Keep this block synchronized with .github/ISSUE_TEMPLATE/shared/codex-execution-contract.md.
  # `npm run issue:validate` detects drift because GitHub issue forms cannot include external Markdown files.
  - type: markdown
    attributes:
      value: |
        ## Codex execution contract

        This issue is intended to be a self-sufficient implementation contract. Repository-wide engineering and documentation conventions are defined by the applicable `AGENTS.md` files; mandatory task procedures may additionally be defined by repo-local Skills. Both also apply.

        When Codex is launched with the full GitHub issue URL, Codex must:

        - read the complete issue before changing code;
        - verify that the issue belongs to `zailghe3/artifact-dev-toolkit`;
        - treat the issue as the source of truth for objective, required behaviour, scope, out-of-scope boundaries, and acceptance criteria;
        - treat the objective, required behaviour, behavioural requirements and invariants, technical constraints, out-of-scope boundaries, and acceptance criteria as the binding feature contract;
        - treat the current gap and implementation-context sections as planning-time context that must be revalidated against current `main` rather than as a frozen implementation plan;
        - compare the binding feature contract with current `main`, current specifications, and relevant canonical contracts before editing;
        - stop without modifying code and report that no implementation is needed if current `main` already satisfies the binding feature contract;
        - stop without modifying code and report that the issue needs re-baselining if its objective remains valid but planning-time assumptions are materially stale, contradictory, or unsafe to apply to the current architecture;
        - stop without modifying code and report the conflict if the issue has been superseded by or conflicts with newer canonical product requirements;
        - do not recreate obsolete implementation mechanics merely because planning-time context or an older requirement described them;
        - stop without modifying code if the issue cannot be retrieved, belongs to another repository, is materially incomplete, or conflicts with the task context;
        - never substitute another issue, prior task, inferred feature, or remembered requirement;
        - remain within the stated scope and avoid unrelated improvements or upgrades;
        - follow mandatory Skill routing declared by the applicable `AGENTS.md` files;
        - read the relevant current specification before implementation;
        - update the relevant specification in the same pull request when implemented behaviour changes;
        - preserve the repository's documented compatibility and security constraints;
        - run the repository checks relevant to the changed area, including the normal test, lint, typecheck, and production-build checks for functional implementation unless genuinely inapplicable;
        - run conditional validators only when the corresponding feature-request, artifact, workflow, or other governed area changes;
        - report validation accurately as passed, failed, inapplicable, or not completed because of an environment restriction;
        - inspect the final diff and ensure every tracked change is intentional and in scope;
        - open a pull request whose title or summary includes the Feature ID;
        - include the exact issue-specific closing reference `Closes #<issue-number>` in the pull request body;
        - verify after opening the pull request that it targets the intended base branch, contains only intended files, includes the required closing reference, and reports validation for the final PR head;
        - describe intentional deviations, failed or unavailable checks, and unresolved items accurately rather than implying successful completion.
  - type: input
    id: feature-id
    attributes:
      label: Feature ID
      description: Stable capability identifier using the repository convention, for example DEV-001.
      placeholder: DEV-001
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What durable outcome should this change achieve even if earlier features are implemented differently?
      placeholder: Describe the user or product outcome, not the technical approach.
    validations:
      required: true

  - type: textarea
    id: user-context
    attributes:
      label: User context
      description: Why is this useful, and how will it be used?
    validations:
      required: true

  - type: textarea
    id: current-behaviour
    attributes:
      label: Current gap at planning time
      description: Describe the product or capability gap observed now. Avoid a detailed implementation inventory; Codex will re-establish current state before implementation.
    validations:
      required: true

  - type: textarea
    id: required-behaviour
    attributes:
      label: Required behaviour
      description: Describe the stable end-state behaviour that must remain true regardless of internal implementation.
    validations:
      required: true

  - type: textarea
    id: user-experience
    attributes:
      label: User experience
      description: Describe user-visible screens, actions, messages, and interaction flow where these are part of the feature contract.

  - type: textarea
    id: functional-requirements
    attributes:
      label: Behavioural requirements and invariants
      description: List observable requirements, domain rules, safety properties, and stable invariants. Avoid file, function, route, helper, algorithm, or storage prescriptions unless externally contractual.
      placeholder: |
        1. Required behaviour or invariant one
        2. Required behaviour or invariant two
        3. Required behaviour or invariant three
    validations:
      required: true

  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical constraints
      description: Note architecture, security, compatibility, deployment, migration, or operational constraints that must be respected. Do not use this section as an implementation plan.

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State what must deliberately not be included in this issue.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Provide observable or stable contract-level evidence that the required outcome is satisfied; prefer black-box checks over implementation assertions.
      placeholder: |
        - [ ] Required user-visible behaviour is demonstrated
        - [ ] Relevant failure and safety invariants are exercised
        - [ ] Relevant repository validation succeeds
        - [ ] Current application specification is updated when behaviour changes
    validations:
      required: true

  - type: checkboxes
    id: implementation-completion
    attributes:
      label: Definition of done
      description: These requirements apply to the implementation pull request.
      options:
        - label: The issue acceptance criteria are satisfied.
          required: true
        - label: Relevant checks, tests, typechecking, and build validation pass.
          required: true
        - label: Security and deployment implications have been considered.
          required: true
        - label: The current application specification has been reviewed and updated in the same pull request where required.
          required: true
        - label: The pull request includes the Feature ID and a closing reference to this issue.
          required: true

  - type: textarea
    id: codex-guidance
    attributes:
      label: Implementation context — revalidate against current main
      description: Optional non-binding context such as existing areas worth inspecting or known traps. Do not prescribe an internal solution unless that mechanism is itself required by the feature contract.
