[package]
name = "adt-codex-auth-probe"
version = "0.1.0"
edition = "2021"

[dependencies]
native-tls = "=0.2.14"
reqwest = { version = "=0.12.28", features = ["json", "native-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
