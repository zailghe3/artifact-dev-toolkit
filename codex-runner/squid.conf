# Forward-proxy policy for the split Runner. Do not enable URL or header logging.
http_port 3128
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl codex_provider dstdomain auth.openai.com chatgpt.com
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8 2001:db8::/32
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny non_public
http_access allow codex_provider
http_access deny all
cache deny all
access_log none
cache_log /dev/stdout
logfile_rotate 0
via off
forwarded_for delete
request_header_access Authorization allow all
request_header_access Proxy-Authorization allow all
