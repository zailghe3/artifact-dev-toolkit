services:
  codex-runner:
    image: poulti/adt-codex-runner:latest
    restart: unless-stopped
    environment:
      CODEX_HOME: /data/codex
      CODEX_RUNNER_SHARED_SECRET_FILE: /run/secrets/codex_runner_shared_secret
    secrets:
      - codex_runner_shared_secret
    volumes:
      - codex_home:/data/codex
    networks:
      - codex_ingress
secrets:
  codex_runner_shared_secret:
    external: true
volumes:
  codex_home:
networks:
  codex_ingress:
    name: codex_ingress
